[project]
name = "civicmind-api"
version = "1.0.0"
description = "CivicMind complaint intelligence API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.34.0",
  "sqlalchemy>=2.0.40",
  "psycopg[binary]>=3.2.6",
  "pgvector>=0.3.6",
  "pydantic-settings>=2.8.0",
  "httpx>=0.28.1",
  "python-multipart>=0.0.20",
]

[tool.vercel]
entrypoint = "app.main:app"
